# CloudCannon Configuration for berez-web
# https://cloudcannon.com/documentation/articles/setting-global-configuration/

# Source and output paths
source: _source
output: _site

# Build configuration
paths:
  data: _data
  layouts: _layouts
  includes: _includes

# Collections - editable content groups
collections_config:
  pages:
    path: ""
    glob:
      - "*.html"
      - "*.md"
      - "!docs/**"
    name: Pages
    icon: wysiwyg
    _enabled_editors:
      - visual
      - content
      - data

# Data files that can be edited
data_config:
  site:
    path: _data/site.json
    name: Site Settings
    icon: settings

# File handling
file_config:
  - path: assets/images
    glob: "**/*.{png,jpg,jpeg,gif,svg,webp}"

# Editor configuration
_editables:
  content:
    bold: true
    italic: true
    link: true
    bulletedlist: true
    numberedlist: true
    code: true
    blockquote: true
    horizontalrule: true
    image: true
    table: true

# Inputs (custom field types)
_inputs:
  title:
    type: text
    label: Page Title
  description:
    type: textarea
    label: Description
  baseUrl:
    type: url
    label: Site URL
    comment: Your production URL (e.g. https://example.com) - used for canonical URLs and sitemap
  tags:
    type: multiselect
    options:
      values:
        - docs
        - page

# Preserved paths - directories to preserve between builds (relative to output)
# If files in these paths haven't changed, they won't be rebuilt
preserved_paths:
  - assets/images
  - assets/fonts
  - .cache

# Build hooks
timezone: Etc/UTC

